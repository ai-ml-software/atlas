---
deployment:
  tasks:
    # cPanel account / production document root.
    # Change only this path if the site is deployed to an addon-domain subdirectory.
    - export DEPLOYPATH=/home/altugpaa/public_html/

    # Preserve the production database configuration before replacing application/.
    - if [ -f "${DEPLOYPATH}application/config/database.php" ]; then /bin/cp "${DEPLOYPATH}application/config/database.php" "${DEPLOYPATH}application/config/.database.php.deploy-backup"; fi

    # Deploy the PHP application and its runtime assets.
    - /bin/cp index.php "${DEPLOYPATH}"
    - /bin/cp .htaccess "${DEPLOYPATH}"
    - /bin/cp image.png "${DEPLOYPATH}"
    - /bin/cp logo.png "${DEPLOYPATH}"
    - /bin/cp -R application "${DEPLOYPATH}"
    - /bin/cp -R assets "${DEPLOYPATH}"
    - /bin/cp -R languages "${DEPLOYPATH}"
    - /bin/cp -R system "${DEPLOYPATH}"
    - /bin/cp -R update "${DEPLOYPATH}"
    - /bin/cp -R uploads "${DEPLOYPATH}"

    # Restore the existing production database configuration after the copy.
    - if [ -f "${DEPLOYPATH}application/config/.database.php.deploy-backup" ]; then /bin/cp "${DEPLOYPATH}application/config/.database.php.deploy-backup" "${DEPLOYPATH}application/config/database.php"; /bin/rm -f "${DEPLOYPATH}application/config/.database.php.deploy-backup"; fi

    # Never deploy the machine-local database override or deployment diagnostics.
    - /bin/rm -f "${DEPLOYPATH}application/config/database.local.php"
    - /bin/rm -f "${DEPLOYPATH}deploy-check.php"

    # Ensure CodeIgniter runtime directories exist and are writable by the site owner.
    - /bin/mkdir -p "${DEPLOYPATH}application/cache" "${DEPLOYPATH}application/logs" "${DEPLOYPATH}uploads/academy" "${DEPLOYPATH}uploads/thumbnails"
    - /bin/chmod 755 "${DEPLOYPATH}application/cache" "${DEPLOYPATH}application/logs" "${DEPLOYPATH}uploads" "${DEPLOYPATH}uploads/academy" "${DEPLOYPATH}uploads/thumbnails"
